<div class="listing-card" [routerLink]="['/listing', listing.id]">
    <div class="image-container">
        <img [src]="listing.imageUrl || 'assets/images/placeholder.jpg'" [alt]="listing.title" loading="lazy">
        <button class="favorite-btn" (click)="$event.stopPropagation(); listing.isFavorite = !listing.isFavorite"
            [class.active]="listing.isFavorite">
            <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path
                    d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z">
                </path>
            </svg>
        </button>
    </div>
    <div class="content">
        <div class="price">{{ listing.price | number }} {{ listing.currency }}</div>
        <h3 class="title">{{ listing.title }}</h3>
        <div class="meta">
            <span class="location">{{ listing.location }}</span>
            <span class="dot">•</span>
            <span class="time">{{ listing.postedTime | date:'shortDate' }}</span>
        </div>
    </div>
</div>

<div class="step-container">
    <h3>جزئیات آگهی</h3>
    <div class="category-summary" *ngIf="category">
        ثبت در: <strong>{{ category.category.name }} {{ category.subCategory ? '‹ ' + category.subCategory.name : ''
            }}</strong>
    </div>

    <form [formGroup]="form" (ngSubmit)="submit()">
        <!-- Images -->
        <div class="form-section">
            <h4>تصاویر</h4>
            <div class="image-upload-area">
                <div class="preview-grid">
                    <div class="preview-item" *ngFor="let img of uploadedImages; let i = index">
                        <img [src]="img">
                        <button type="button" class="remove-btn" (click)="removeImage(i)">×</button>
                    </div>

                    <label class="upload-btn" *ngIf="uploadedImages.length < 10">
                        <input type="file" class="file-input" (change)="onFileSelected($event)" accept="image/*"
                            multiple>
                        <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
                            stroke="currentColor" stroke-width="2">
                            <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                            <circle cx="8.5" cy="8.5" r="1.5"></circle>
                            <polyline points="21 15 16 10 5 21"></polyline>
                        </svg>
                        <span>+ افزودن عکس</span>
                    </label>
                </div>
                <p class="upload-hint">تا ۱۰ عکس می‌توانید آپلود کنید</p>
            </div>
        </div>

        <!-- Details -->
        <div class="form-section">
            <h4>جزئیات</h4>

            <div class="form-group">
                <label>عنوان*</label>
                <input type="text" formControlName="title" placeholder="مثال: تویوتا کرولا ۲۰۲۲ کم کارکرد">
                <div class="error" *ngIf="form.get('title')?.touched && form.get('title')?.invalid">
                    عنوان الزامی است (حداقل ۱۰ کاراکتر).
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label>قیمت (تومان)*</label>
                    <input type="number" formControlName="price" placeholder="مبلغ">
                </div>
                <div class="form-group">
                    <label>وضعیت*</label>
                    <select formControlName="condition">
                        <option value="new">نو</option>
                        <option value="used">کارکرده</option>
                    </select>
                </div>
            </div>

            <div class="form-group">
                <label>توضیحات*</label>
                <textarea formControlName="description" rows="5"
                    placeholder="توضیحات کالای خود را بنویسید..."></textarea>
                <div class="error" *ngIf="form.get('description')?.touched && form.get('description')?.invalid">
                    توضیحات الزامی است.
                </div>
            </div>
        </div>

        <!-- Contact -->
        <div class="form-section">
            <h4>اطلاعات تماس</h4>
            <div class="form-row">
                <div class="form-group">
                    <label>شهر*</label>
                    <select formControlName="location">
                        <option value="">انتخاب شهر</option>
                        <option value="Tehran">تهران</option>
                        <option value="Isfahan">اصفهان</option>
                        <option value="Shiraz">شیراز</option>
                        <option value="Mashhad">مشهد</option>
                        <option value="Tabriz">تبریز</option>
                        <option value="Karaj">کرج</option>
                        <option value="Ahvaz">اهواز</option>
                        <option value="Qom">قم</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>شماره تماس*</label>
                    <input type="tel" formControlName="phone" placeholder="۰۹۱۲...">
                </div>
            </div>
            <div class="form-group">
                <label>نام*</label>
                <input type="text" formControlName="name">
            </div>
        </div>

        <div class="actions">
            <button type="button" class="btn btn-link" (click)="back.emit()" [disabled]="isSubmitting">بازگشت</button>
            <button type="submit" class="btn btn-primary" [disabled]="isSubmitting">
                {{ isSubmitting ? 'در حال ثبت...' : 'ثبت آگهی' }}
            </button>
        </div>

    </form>
</div>

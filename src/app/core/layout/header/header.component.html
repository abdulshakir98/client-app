<header class="app-header" *ngIf="shouldShowHeader">
  <div class="container header-content">
    <!-- Logo -->
    <a routerLink="/" class="logo">
      <span class="brand">{{ layoutService.t('app.name') }}</span>
    </a>

    <!-- Search Bar (Desktop) -->
    <div class="search-bar">
      <input type="text" [placeholder]="layoutService.t('home.searchPlaceholder')" />
      <button class="btn-search">
        <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="11" cy="11" r="8"></circle>
          <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
        </svg>
      </button>
    </div>

    <!-- Navigation Actions -->
    <nav class="nav-actions">
      <!-- Post Ad Button -->
      <a routerLink="/post-ad" class="btn btn-primary post-ad-btn">
        <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
          stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <line x1="12" y1="5" x2="12" y2="19"></line>
          <line x1="5" y1="12" x2="19" y2="12"></line>
        </svg>
        <span>{{ layoutService.t('nav.postAd') }}</span>
      </a>

      <!-- Language Toggle -->
      <button class="btn btn-outline lang-toggle" (click)="toggleLanguage()">
        {{ layoutService.currentLang() === 'fa' ? '🇬🇧 EN' : '🇮🇷 فا' }}
      </button>

      <!-- Profile Menu with Dropdown -->
      <div class="profile-menu">
        <button class="btn-icon" (click)="toggleProfileMenu()">
          <svg xmlns="http://www.w3.org/2000/svg" width="24" height="24" viewBox="0 0 24 24" fill="none"
            stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
            <circle cx="12" cy="7" r="4"></circle>
          </svg>
        </button>

        <!-- Dropdown Menu -->
        <div class="dropdown-menu" *ngIf="showProfileMenu">
          <div class="dropdown-header">
            <span class="username">{{ authService.currentUser()?.username || 'کاربر' }}</span>
          </div>
          <a routerLink="/profile" class="dropdown-item" (click)="showProfileMenu = false">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"></path>
              <circle cx="12" cy="7" r="4"></circle>
            </svg>
            پروفایل
          </a>
          <a routerLink="/my-ads" class="dropdown-item" (click)="showProfileMenu = false">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
              <line x1="3" y1="9" x2="21" y2="9"></line>
              <line x1="9" y1="21" x2="9" y2="9"></line>
            </svg>
            آگهی‌های من
          </a>
          <a routerLink="/messages" class="dropdown-item" (click)="showProfileMenu = false">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"></path>
            </svg>
            پیام‌ها
          </a>
          <div class="dropdown-divider"></div>
          <button class="dropdown-item logout" (click)="logout()">
            <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none"
              stroke="currentColor" stroke-width="2">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
              <polyline points="16 17 21 12 16 7"></polyline>
              <line x1="21" y1="12" x2="9" y2="12"></line>
            </svg>
            خروج
          </button>
        </div>
      </div>
    </nav>
  </div>
</header>
